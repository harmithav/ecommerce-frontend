<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-container">

    <h1>Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Enter Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <button onclick="loginUser()">
      Login
    </button>

  </div>

  <script src="login.js"></script>

</body>
</html>
