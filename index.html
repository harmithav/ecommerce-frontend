<!DOCTYPE html>
<html>
<head>
  <title>MyShop</title>

  <!-- ✅ THIS LINE WAS MISSING -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
<nav class="navbar">
  <h2>MyShop</h2>
  <input
  type="text"
  id="search"
  placeholder="Search products..."
  onkeyup="searchProducts()"
  />
    
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="cart.html">
  Cart (<span id="cart-count">0</span>)
</a>
    <div class="account-box">

  <button id="account-btn">
    My Account
  </button>

  <div id="account-dropdown" class="dropdown">

    <p id="user-email"></p>

    <a href="cart.html">My Cart</a>

    <a href="#">My Orders</a>

    <a href="#" onclick="logoutUser()">
      Logout
    </a>

  </div>

    </div>
  </div>
</nav>

  <!-- BANNER -->
  <section class="hero">

  <div class="hero-content">

    <h1>Welcome to Store</h1>

    <p>
      Find the best products at the best prices
    </p>

    <button class="shop-btn">
      Shop Now
    </button>

  </div>

</section>

  <!-- PRODUCTS -->
  <!-- CATEGORY BUTTONS -->


<div class="categories">

  <button class="category-btn"
    onclick="filterProducts('All')">
    All
  </button>

  <button class="category-btn"
    onclick="filterProducts('Mens Wear')">
    Mens Wear
  </button>

  <button class="category-btn"
    onclick="filterProducts('Women Wear')">
    Women Wear
  </button>

  <button class="category-btn"
    onclick="filterProducts('Shoes')">
    Shoes
  </button>

  <button class="category-btn"
    onclick="filterProducts('Electronics')">
    Electronics
  </button>

  <button class="category-btn"
    onclick="filterProducts('Beauty')">
    Beauty
  </button>

  <button class="category-btn"
    onclick="filterProducts('Kitchen')">
    Kitchen
  </button>

</div>
<section id="products" class="product-grid"></section>


  <!-- FOOTER -->
  <footer>
    <p>© 2026 MyShop</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
